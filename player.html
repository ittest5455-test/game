<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Retro Player</title>
  
  <!-- JS-DOS v8 CSS -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container, #dos-container {
      width: 100%;
      height: 100%;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading-box {
      position: absolute;
      color: #00f0ff;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loading-box">
    <div class="spinner"></div>
    <div id="status-text">กำลังโหลดเอนจินเกม...</div>
  </div>

  <div id="game-container"></div>
  <div id="dos-container" style="display:none;"></div>

  <!-- JS-DOS v8 Script -->
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type") || "emulatorjs";
    const core = params.get("core") || "nes";
    const gameUrl = params.get("game") || "";
    const statusText = document.getElementById("status-text");

    function hideLoader() {
      const loader = document.getElementById("loading-box");
      if (loader) loader.style.display = "none";
      try {
        window.parent.postMessage({ type: "EMULATOR_READY" }, "*");
      } catch (e) {}
    }

    if (type === "jsdos") {
      document.getElementById("game-container").style.display = "none";
      const dosDiv = document.getElementById("dos-container");
      dosDiv.style.display = "block";
      statusText.innerText = "กำลังแตกไฟล์และเริ่มรัน MS-DOS...";

      Dos(dosDiv, {
        url: gameUrl,
        theme: "dark",
        autoStart: true,
        kiosk: true,
        noCloud: true
      }).then(() => {
        hideLoader();
      }).catch((err) => {
        console.error("DOS Error:", err);
        statusText.innerText = "เกิดข้อผิดพลาดในการโหลดเกม DOS";
      });

    } else {
      // EmulatorJS (NES, SNES, GBA, Genesis, Arcade, PS1)
      statusText.innerText = "กำลังดาวน์โหลด ROM เข้าสู่ WebAssembly...";

      window.EJS_player = '#game-container';
      window.EJS_core = core;
      window.EJS_gameUrl = gameUrl;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_startOnLoaded = true;
      window.EJS_color = '#00f0ff';
      window.EJS_threads = false;

      if (core === 'psx') {
        window.EJS_biosUrl = 'https://cdn.emulatorjs.org/stable/data/scph5501.bin';
      }

      window.EJS_ready = function() {
        hideLoader();
      };
      window.EJS_onGameStart = function() {
        hideLoader();
      };

      const loaderScript = document.createElement("script");
      loaderScript.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      loaderScript.onload = () => {
        setTimeout(hideLoader, 3000);
      };
      document.body.appendChild(loaderScript);
    }
  </script>

</body>
</html>
